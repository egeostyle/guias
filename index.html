<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Completa Kingdom Hearts</title>
    <style>
        :root {
            --azul-oscuro: #0d1b2a;
            --azul-medio: #1b263b;
            --azul-claro: #415a77;
            --dorado: #e0aaff;
            --blanco: #ffffff;
            --gris-claro: #e0e1dd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            height: 100vh;
            background-color: var(--azul-oscuro);
            color: var(--blanco);
            overflow-y: auto;
            padding: 20px;
            box-shadow: 4px 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        #sidebar h2 {
            color: var(--dorado);
            text-align: center;
            border-bottom: 2px solid var(--dorado);
            padding-bottom: 15px;
        }

        #sidebar a {
            display: block;
            color: var(--gris-claro);
            text-decoration: none;
            padding: 12px 10px;
            border-radius: 5px;
            font-size: 0.95rem;
            transition: background 0.2s, color 0.2s;
        }

        #sidebar a:hover, #sidebar a.active {
            background-color: var(--azul-claro);
            color: var(--dorado);
            font-weight: bold;
        }

        #main-content {
            margin-left: 320px;
            padding: 40px;
        }

        header {
            background: linear-gradient(135deg, var(--azul-oscuro), var(--azul-medio));
            color: var(--blanco);
            padding: 40px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
        }

        .seccion {
            background-color: var(--blanco);
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-left: 5px solid var(--dorado);
        }

        .seccion h2 {
            color: var(--azul-medio);
            margin-top: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            font-size: 2rem;
            font-weight: 800;
        }

        .seccion h3 {
            color: var(--azul-claro);
            font-size: 1.5rem;
            margin-top: 25px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .seccion h4 {
            color: var(--azul-oscuro);
            font-size: 1.2rem;
            margin-top: 20px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .seccion p {
            font-size: 1.05rem;
            margin-bottom: 15px;
            text-align: justify;
        }

        .seccion ul, .seccion ol {
            margin: 10px 0 20px 20px;
            padding: 0;
        }

        .seccion li {
            margin-bottom: 8px;
            font-size: 1.05rem;
        }

        .seccion img {
            max-width: 100%;
            height: auto;
            max-height: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border: 2px solid var(--gris-claro);
            display: block;
            margin: 20px auto; /* Centramos la imagen */
            transition: transform 0.2s;
        }

        .seccion img:hover {
            transform: scale(1.02);
        }

        #menu-toggle {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            background-color: var(--azul-oscuro);
            color: var(--dorado);
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 1100;
        }

        @media (max-width: 900px) {
            #menu-toggle { display: block; }
            #sidebar { transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            #main-content { margin-left: 0; padding: 20px; }
        }
    </style>
</head>
<body>

    <button id="menu-toggle">☰ Menú</button>

    <nav id="sidebar">
        <h2>⚔️ Kingdom Hearts</h2>
        <div id="menu-links"></div>
    </nav>

    <main id="main-content">
        <header>
            <h1>Kingdom Hearts</h1>
            <p>Guía Completa, 100% Walkthrough</p>
        </header>
        <div id="contenido-secciones"></div>
    </main>

    <script>
        const toggleBtn = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        toggleBtn.addEventListener('click', () => sidebar.classList.toggle('open'));

        // Función para pintar los elementos en el orden exacto en que fueron extraídos
        function pintarElementos(elementos) {
            let html = "";
            
            elementos.forEach(el => {
                switch (el.tipo) {
                    case 'h1':
                    case 'h2':
                    case 'h3':
                    case 'h4':
                        html += `<${el.tipo}>${el.contenido}</${el.tipo}>`;
                        break;
                    case 'p':
                        html += `<p>${el.contenido}</p>`;
                        break;
                    case 'ul':
                    case 'ol':
                        html += `<${el.tipo}>`;
                        el.contenido.forEach(item => {
                            html += `<li>${item}</li>`;
                        });
                        html += `</${el.tipo}>`;
                        break;
                    case 'img':
                        html += `<img src="${el.contenido.src}" alt="${el.contenido.alt}" loading="lazy">`;
                        break;
                    default:
                        break;
                }
            });
            
            return html;
        }

        async function cargarGuia() {
            try {
                const respuesta = await fetch('guia_completa.json');
                if (!respuesta.ok) throw new Error("No se pudo cargar el JSON");
                const datos = await respuesta.json();
                
                const menuLinks = document.getElementById('menu-links');
                const contenido = document.getElementById('contenido-secciones');

                datos.forEach((capitulo, index) => {
                    const idSeccion = `capitulo-${index}`;
                    
                    // Menú lateral
                    const enlace = document.createElement('a');
                    enlace.href = `#${idSeccion}`;
                    enlace.textContent = `${index + 1}. ${capitulo.titulo.replace("Kingdom Hearts - ", "")}`;
                    menuLinks.appendChild(enlace);

                    // Sección
                    const divSeccion = document.createElement('div');
                    divSeccion.className = 'seccion';
                    divSeccion.id = idSeccion;

                    // Título principal de la página
                    const h2 = document.createElement('h2');
                    h2.textContent = capitulo.titulo.replace("Kingdom Hearts - ", "");
                    divSeccion.appendChild(h2);

                    // Pintamos el contenido en el orden REAL de la web (títulos, párrafos, imágenes...)
                    const divContenido = document.createElement('div');
                    divContenido.innerHTML = pintarElementos(capitulo.elementos || []);
                    divSeccion.appendChild(divContenido);

                    contenido.appendChild(divSeccion);
                });

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('contenido-secciones').innerHTML = 
                    "<p style='color:red; font-weight:bold;'>Error al cargar el JSON.</p>";
            }
        }

        cargarGuia();
    </script>
</body>
</html>
