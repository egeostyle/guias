<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Completa Kingdom Hearts</title>
    <style>
        :root {
            --bg-dark: #121212;
            --text-main: #e0e0e0;
            --text-title: #fbbf24;
            --text-sub: #a3a3a3;
            --accent: #fbbf24;
            --note-bg: #2a2a2a;
            --note-border: #fbbf24;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.7;
        }

        /* Menú Lateral */
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background-color: #1a1a1a;
            color: #fff;
            overflow-y: auto;
            padding: 20px;
            z-index: 1000;
            transition: transform 0.3s ease;
            border-right: 1px solid #333;
        }

        #sidebar h2 {
            color: var(--text-title);
            text-align: center;
            border-bottom: 2px solid var(--text-title);
            padding-bottom: 15px;
            margin-top: 0;
        }

        #sidebar a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            margin-bottom: 4px;
            transition: all 0.2s;
        }

        #sidebar a:hover, #sidebar a.active {
            background-color: #333;
            color: var(--text-title);
        }

        /* Botón menú móvil */
        #menu-toggle {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            background-color: var(--accent);
            color: #121212;
            border: none;
            padding: 12px 16px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 1100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Contenido Principal - SIN BURBUJAS Y ANCHO COMPLETO */
        #main-content {
            margin-left: 280px;
            padding: 20px 40px 40px 40px; /* Menos padding para aprovechar el ancho */
        }

        /* Cabecera alineada a la derecha y sin bordes */
        header {
            text-align: right;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        header h1 {
            font-size: 2.5rem;
            color: #fff;
            margin: 0;
        }

        header p {
            color: var(--text-sub);
            margin: 5px 0 0 0;
        }

        /* Secciones sin bordes ni sombras */
        .seccion {
            background: transparent;
            padding: 0;
            margin-bottom: 50px;
        }

        .seccion h2 {
            font-size: 2.2rem;
            color: var(--text-title);
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .seccion h3 {
            font-size: 1.5rem;
            color: #fff;
            margin: 25px 0 15px 0;
        }

        .seccion h4 {
            font-size: 1.2rem;
            color: var(--text-title);
            margin: 20px 0 10px 0;
        }

        .seccion p {
            font-size: 1.1rem;
            margin: 0 0 20px 0;
            color: var(--text-main);
        }

        /* Negritas y Cursivas */
        .seccion strong, .seccion b {
            color: #fff;
            font-weight: bold;
        }

        .seccion em, .seccion i {
            color: #d1d5db;
            font-style: italic;
        }

        /* Listas */
        .seccion ul, .seccion ol {
            margin: 10px 0 20px 20px;
            padding: 0;
        }

        .seccion li {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        /* Notas y Citas (blockquote) */
        .seccion blockquote, .seccion .nota {
            background-color: var(--note-bg);
            border-left: 5px solid var(--note-border);
            padding: 15px 20px;
            margin: 20px 0;
            border-radius: 4px;
            font-style: italic;
            color: #d1d5db;
        }

        /* Imágenes */
        .seccion img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 25px auto;
            border-radius: 8px;
            border: 1px solid #444;
        }

        /* Botones Navegación */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }

        .nav-btn {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.2s;
            border: none;
            cursor: pointer;
        }

        .nav-btn.prev { background-color: #374151; color: #fff; }
        .nav-btn.next { background-color: var(--accent); color: #121212; }

        .nav-btn:hover { transform: scale(1.05); }
        .nav-btn.disabled { opacity: 0.5; pointer-events: none; }

        /* Responsive */
        @media (max-width: 900px) {
            #menu-toggle { display: block; }
            #sidebar { width: 100%; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            #main-content { margin-left: 0; padding: 60px 15px 20px 15px; } /* Padding mínimo para aprovechar ancho */
            header h1 { font-size: 1.8rem; }
            .seccion h2 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <button id="menu-toggle">☰ Menú</button>

    <nav id="sidebar">
        <h2>⚔️ Kingdom Hearts</h2>
        <div id="menu-links"></div>
    </nav>

    <main id="main-content">
        <header>
            <h1>Kingdom Hearts</h1>
            <p>Guía Completa, 100% Walkthrough</p>
        </header>
        <div id="contenido-secciones"></div>
    </main>

    <script>
        const toggleBtn = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        toggleBtn.addEventListener('click', () => sidebar.classList.toggle('open'));

        // Función para pintar los elementos
        // Función para pintar los elementos en el orden exacto
        function pintarElementos(elementos, tituloActual) {
            let html = "";
            elementos.forEach(el => {
                // Filtrar "Guía Kingdom Hearts" y títulos duplicados
                if (el.tipo === 'h1' || el.tipo === 'h2') {
                    if (el.contenido === "Guía Kingdom Hearts" || el.contenido === tituloActual) {
                        return;
                    }
                }

                switch (el.tipo) {
                    case 'h1': case 'h2': case 'h3': case 'h4':
                        html += `<${el.tipo}>${el.contenido}</${el.tipo}>`;
                        break;
                    case 'p':
                        // Convertir enlaces rotos en enlaces internos
                        let pContenido = el.contenido;
                        // Buscar enlaces que terminen en -pN.php y convertirlos
                        pContenido = pContenido.replace(/href="([^"]*?)-p(\d+)\.php"/g, (match, url, num) => {
                            // Calcular el índice de la sección (0-based)
                            const indiceSeccion = parseInt(num) - 1;
                            return `href="#capitulo-${indiceSeccion}"`;
                        });
                        html += `<p>${pContenido}</p>`;
                        break;
                    case 'ul': case 'ol':
                        html += `<${el.tipo}>`;
                        el.contenido.forEach(item => {
                            let itemContenido = item;
                            itemContenido = itemContenido.replace(/href="([^"]*?)-p(\d+)\.php"/g, (match, url, num) => {
                                const indiceSeccion = parseInt(num) - 1;
                                return `href="#capitulo-${indiceSeccion}"`;
                            });
                            html += `<li>${itemContenido}</li>`;
                        });
                        html += `</${el.tipo}>`;
                        break;
                    case 'nota':
                        let notaContenido = el.contenido;
                        notaContenido = notaContenido.replace(/href="([^"]*?)-p(\d+)\.php"/g, (match, url, num) => {
                            const indiceSeccion = parseInt(num) - 1;
                            return `href="#capitulo-${indiceSeccion}"`;
                        });
                        html += `<blockquote>${notaContenido}</blockquote>`;
                        break;
                    case 'img':
                        html += `<img src="${el.contenido.src}" alt="${el.contenido.alt}" loading="lazy">`;
                        break;
                    default: break;
                }
            });
            return html;
        }

        async function cargarGuia() {
            try {
                const respuesta = await fetch('guia_completa.json');
                if (!respuesta.ok) throw new Error("No se pudo cargar el JSON");
                const datos = await respuesta.json();
                
                const menuLinks = document.getElementById('menu-links');
                const contenido = document.getElementById('contenido-secciones');

                datos.forEach((capitulo, index) => {
                    const idSeccion = `capitulo-${index}`;
                    const tituloLimpio = capitulo.titulo.replace("Kingdom Hearts - ", "");
                    
                    // Menú
                    const enlace = document.createElement('a');
                    enlace.href = `#${idSeccion}`;
                    enlace.textContent = `${index + 1}. ${tituloLimpio}`;
                    enlace.addEventListener('click', () => sidebar.classList.remove('open'));
                    menuLinks.appendChild(enlace);

                    // Sección sin la estrella redundante
                    const divSeccion = document.createElement('div');
                    divSeccion.className = 'seccion';
                    divSeccion.id = idSeccion;

                    const h2 = document.createElement('h2');
                    h2.textContent = tituloLimpio;
                    divSeccion.appendChild(h2);

                    // Contenido
                    const divContenido = document.createElement('div');
                    divContenido.innerHTML = pintarElementos(capitulo.elementos || [], tituloLimpio);
                    divSeccion.appendChild(divContenido);

                    // Botones
                    const navDiv = document.createElement('div');
                    navDiv.className = 'nav-buttons';

                    const prevBtn = document.createElement('a');
                    prevBtn.className = 'nav-btn prev';
                    if (index === 0) {
                        prevBtn.classList.add('disabled');
                        prevBtn.textContent = '◀ Anterior';
                    } else {
                        prevBtn.href = `#capitulo-${index - 1}`;
                        prevBtn.textContent = '◀ Anterior';
                    }

                    const nextBtn = document.createElement('a');
                    nextBtn.className = 'nav-btn next';
                    if (index === datos.length - 1) {
                        nextBtn.classList.add('disabled');
                        nextBtn.textContent = 'Siguiente ▶';
                    } else {
                        nextBtn.href = `#capitulo-${index + 1}`;
                        nextBtn.textContent = `Siguiente: ${datos[index + 1].titulo.replace("Kingdom Hearts - ", "").slice(0, 25)}... ▶`;
                    }

                    navDiv.appendChild(prevBtn);
                    navDiv.appendChild(nextBtn);
                    divSeccion.appendChild(navDiv);

                    contenido.appendChild(divSeccion);
                });

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('contenido-secciones').innerHTML = 
                    "<p style='color:red; font-weight:bold;'>Error al cargar el JSON.</p>";
            }
        }

        cargarGuia();
    </script>
</body>
</html>
