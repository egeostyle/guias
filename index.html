<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Completa Kingdom Hearts</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
            --text-title: #fbbf24; /* Dorado */
            --text-sub: #a3a3a3;
            --accent-btn: #fbbf24;
            --btn-text: #121212;
            --btn-secondary: #374151;
            --btn-secondary-text: #ffffff;
        }

        * { box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.7;
        }

        /* Menú Lateral */
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background-color: #18181b;
            color: #fff;
            overflow-y: auto;
            padding: 20px;
            z-index: 1000;
            transition: transform 0.3s ease;
            border-right: 1px solid #333;
        }

        #sidebar h2 {
            color: var(--text-title);
            text-align: center;
            border-bottom: 2px solid var(--text-title);
            padding-bottom: 15px;
            margin-top: 0;
            font-size: 1.5rem;
        }

        #sidebar a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 4px;
            transition: all 0.2s;
        }

        #sidebar a:hover, #sidebar a.active {
            background-color: #374151;
            color: var(--text-title);
            font-weight: bold;
        }

        /* Botón menú móvil */
        #menu-toggle {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            background-color: var(--accent-btn);
            color: var(--btn-text);
            border: none;
            padding: 12px 16px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 1100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Contenido Principal */
        #main-content {
            margin-left: 280px;
            padding: 40px;
        }

        /* Cabecera */
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        header h1 {
            font-size: 2.5rem;
            color: #fff;
            margin: 0;
        }

        header p {
            color: var(--text-sub);
            font-size: 1.2rem;
        }

        /* Estilo de las Tarjetas (Secciones) */
        .seccion {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }

        /* Jerarquías (Estilo app) */
        .seccion h2 {
            font-size: 2.2rem;
            color: var(--text-title);
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 800;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
        }

        .seccion h3 {
            font-size: 1.5rem;
            color: #fff;
            margin: 25px 0 15px 0;
            font-weight: 700;
        }

        .seccion h4 {
            font-size: 1.2rem;
            color: var(--text-title);
            margin: 20px 0 10px 0;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .seccion p {
            font-size: 1.1rem;
            margin: 0 0 20px 0;
            text-align: left;
            color: var(--text-main);
        }

        /* Listas */
        .seccion ul, .seccion ol {
            margin: 10px 0 20px 20px;
            padding: 0;
        }

        .seccion li {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        /* Imágenes */
        .seccion img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #444;
            display: block;
            margin: 25px auto;
        }

        /* Botones de Navegación Anterior/Siguiente */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 40px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }

        .nav-btn {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.2s, background 0.2s;
            cursor: pointer;
            border: none;
        }

        .nav-btn.prev {
            background-color: var(--btn-secondary);
            color: var(--btn-secondary-text);
        }

        .nav-btn.next {
            background-color: var(--accent-btn);
            color: var(--btn-text);
        }

        .nav-btn:hover {
            transform: scale(1.05);
        }

        .nav-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        /* Responsive: Móvil a Pantalla Completa */
        @media (max-width: 900px) {
            #menu-toggle { display: block; }
            
            #sidebar {
                width: 100%;
                transform: translateX(-100%);
            }
            
            #sidebar.open { transform: translateX(0); }
            
            #main-content {
                margin-left: 0;
                padding: 15px; /* Aprovecha todo el ancho con un margen pequeño */
            }

            header h1 {
                font-size: 1.8rem;
            }

            .seccion {
                padding: 20px;
            }

            .seccion h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <button id="menu-toggle">☰ Menú</button>

    <nav id="sidebar">
        <h2>⚔️ Kingdom Hearts</h2>
        <div id="menu-links"></div>
    </nav>

    <main id="main-content">
        <header>
            <h1>Kingdom Hearts</h1>
            <p>Guía Completa, 100% Walkthrough</p>
        </header>
        <div id="contenido-secciones"></div>
    </main>

    <script>
        const toggleBtn = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        toggleBtn.addEventListener('click', () => sidebar.classList.toggle('open'));

        // Función para pintar los elementos en el orden exacto
        function pintarElementos(elementos) {
            let html = "";
            elementos.forEach(el => {
                switch (el.tipo) {
                    case 'h1': case 'h2': case 'h3': case 'h4':
                        html += `<${el.tipo}>${el.contenido}</${el.tipo}>`;
                        break;
                    case 'p':
                        html += `<p>${el.contenido}</p>`;
                        break;
                    case 'ul': case 'ol':
                        html += `<${el.tipo}>`;
                        el.contenido.forEach(item => { html += `<li>${item}</li>`; });
                        html += `</${el.tipo}>`;
                        break;
                    case 'img':
                        html += `<img src="${el.contenido.src}" alt="${el.contenido.alt}" loading="lazy">`;
                        break;
                    default: break;
                }
            });
            return html;
        }

        async function cargarGuia() {
            try {
                const respuesta = await fetch('guia_completa.json');
                if (!respuesta.ok) throw new Error("No se pudo cargar el JSON");
                const datos = await respuesta.json();
                
                const menuLinks = document.getElementById('menu-links');
                const contenido = document.getElementById('contenido-secciones');

                datos.forEach((capitulo, index) => {
                    const idSeccion = `capitulo-${index}`;
                    
                    // Crear enlace en menú
                    const enlace = document.createElement('a');
                    enlace.href = `#${idSeccion}`;
                    // Emoji simple para darle ese toque moderno al menú
                    enlace.textContent = `${index + 1}. ${capitulo.titulo.replace("Kingdom Hearts - ", "")}`;
                    
                    enlace.addEventListener('click', () => sidebar.classList.remove('open'));
                    menuLinks.appendChild(enlace);

                    // Crear sección
                    const divSeccion = document.createElement('div');
                    divSeccion.className = 'seccion';
                    divSeccion.id = idSeccion;

                    // Título (con un emoji al inicio, como en tu captura)
                    const h2 = document.createElement('h2');
                    h2.textContent = `⭐ ${capitulo.titulo.replace("Kingdom Hearts - ", "")}`;
                    divSeccion.appendChild(h2);

                    // Contenido
                    const divContenido = document.createElement('div');
                    divContenido.innerHTML = pintarElementos(capitulo.elementos || []);
                    divSeccion.appendChild(divContenido);

                    // Crear botones de navegación
                    const navDiv = document.createElement('div');
                    navDiv.className = 'nav-buttons';

                    // Botón Anterior
                    const prevBtn = document.createElement('a');
                    prevBtn.className = 'nav-btn prev';
                    if (index === 0) {
                        prevBtn.classList.add('disabled');
                        prevBtn.textContent = '◀ Anterior';
                    } else {
                        prevBtn.href = `#capitulo-${index - 1}`;
                        prevBtn.textContent = '◀ Anterior';
                    }

                    // Botón Siguiente
                    const nextBtn = document.createElement('a');
                    nextBtn.className = 'nav-btn next';
                    if (index === datos.length - 1) {
                        nextBtn.classList.add('disabled');
                        nextBtn.textContent = 'Siguiente ▶';
                    } else {
                        nextBtn.href = `#capitulo-${index + 1}`;
                        nextBtn.textContent = `Siguiente: ${datos[index + 1].titulo.replace("Kingdom Hearts - ", "").slice(0, 25)}... ▶`;
                    }

                    navDiv.appendChild(prevBtn);
                    navDiv.appendChild(nextBtn);
                    divSeccion.appendChild(navDiv);

                    contenido.appendChild(divSeccion);
                });

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('contenido-secciones').innerHTML = 
                    "<p style='color:red; font-weight:bold;'>Error al cargar el JSON.</p>";
            }
        }

        cargarGuia();
    </script>
</body>
</html>
